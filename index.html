<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点优选一键自适应订阅生成器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #14233c 0%, #0a111a 100%);
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: #0f1c2e;
      border: 1px solid #1e3553;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #08121f;
      border: 1px solid #1a3454;
      border-radius: 10px;
      padding: 12px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
      outline: none;
      resize: vertical;
      margin-bottom: 16px;
    }
    textarea:focus { border-color: #38bdf8; }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      padding: 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .result-area {
      margin-top: 20px;
      display: none;
      background: #08121f;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 18px;
    }
    .sub-input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 18px;
    }
    .sub-url {
      flex: 1;
      background: #0f1c2e;
      border: 1px solid #23436b;
      border-radius: 6px;
      padding: 10px;
      color: #a7f3d0;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .btn-copy {
      background: #059669;
      border: none;
      color: #ffffff;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #047857; }
    
    .qr-container {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #0c1827;
      border: 1px dashed #203f67;
      border-radius: 8px;
      padding: 14px;
    }
    .qr-box {
      width: 130px;
      height: 130px;
      background: #ffffff;
      border-radius: 6px;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .qr-box canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .qr-info {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .qr-info b {
      color: #38bdf8;
    }
    .tips {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1><span>⚡</span> 节点优选一键自适应订阅生成器</h1>
    <p class="subtitle">支持【链接复制】与【二维码扫码】，小火箭、V2box、v2rayN、Clash 全通用。</p>

    <label>粘贴优选节点：</label>
    <textarea id="nodes-input" placeholder="请粘贴优选 IP 列表，例如：
104.16.142.65#CF 电信优选
104.16.212.209#CF 电信优选"></textarea>

    <button class="btn-submit" onclick="generateSubscription()">✨ 一键生成全通用自适应订阅</button>

    <div class="result-area" id="result-box">
      <div style="font-size: 13px; font-weight: 600; color: #34d399;">✔ 订阅链接生成成功：</div>

      <!-- 方式一：URL 网址导入 -->
      <div class="sub-input-group">
        <input type="text" id="sub-url-output" class="sub-url" readonly>
        <button class="btn-copy" onclick="copySubUrl()">复制链接</button>
      </div>

      <!-- 方式二：二维码扫码导入 -->
      <div class="qr-container">
        <div class="qr-box">
          <canvas id="qr-canvas"></canvas>
        </div>
        <div class="qr-info">
          <div>📱 <b>推荐方式：扫码即用</b></div>
          <div>打开 <b>Shadowrocket (小火箭)</b> 或 <b>V2box</b>，点击右上角 <b>【扫码】</b> 对准二维码直接导入。</div>
        </div>
      </div>

      <div class="tips">
        💡 <b>电脑端说明：</b> 电脑端 (v2rayN、Clash Meta / Verge) 点击上方“复制链接”，直接粘贴到客户端添加配置即可。
      </div>
    </div>
  </div>

  <script>
    // 纯原生内置极简二维码引擎（完全内联，不依赖任何第三方外部脚本及网络）
    const NativeQR = (function() {
      function QR8bitByte(data) {
        this.mode = 4;
        this.data = data;
      }
      QR8bitByte.prototype = {
        getLength: function() { return new TextEncoder().encode(this.data).length; },
        write: function(buffer) {
          const bytes = new TextEncoder().encode(this.data);
          for (let i = 0; i < bytes.length; i++) buffer.put(bytes[i], 8);
        }
      };

      function QRCodeModel(typeNumber, errorCorrectLevel) {
        this.typeNumber = typeNumber;
        this.errorCorrectLevel = errorCorrectLevel;
        this.modules = null;
        this.moduleCount = 0;
        this.dataCache = null;
        this.dataList = [];
      }
      QRCodeModel.prototype = {
        addData: function(data) { this.dataList.push(new QR8bitByte(data)); },
        isDark: function(row, col) { return this.modules[row][col]; },
        getModuleCount: function() { return this.moduleCount; },
        make: function() {
          this.makeImpl(false, this.getBestMaskPattern());
        },
        makeImpl: function(test, maskPattern) {
          this.moduleCount = this.typeNumber * 4 + 17;
          this.modules = new Array(this.moduleCount);
          for (let row = 0; row < this.moduleCount; row++) {
            this.modules[row] = new Array(this.moduleCount);
            for (let col = 0; col < this.moduleCount; col++) this.modules[row][col] = null;
          }
          this.setupPositionProbePattern(0, 0);
          this.setupPositionProbePattern(this.moduleCount - 7, 0);
          this.setupPositionProbePattern(0, this.moduleCount - 7);
          this.setupPositionAdjustPattern();
          this.setupTimingPattern();
          this.setupTypeInfo(test, maskPattern);
          if (this.typeNumber >= 7) this.setupTypeNumber(test);
          if (this.dataCache == null) this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
          this.mapData(this.dataCache, maskPattern);
        },
        setupPositionProbePattern: function(row, col) {
          for (let r = -1; r <= 7; r++) {
            if (row + r <= -1 || this.moduleCount <= row + r) continue;
            for (let c = -1; c <= 7; c++) {
              if (col + c <= -1 || this.moduleCount <= col + c) continue;
              if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        },
        getBestMaskPattern: function() {
          let minLostPoint = 0, pattern = 0;
          for (let i = 0; i < 8; i++) {
            this.makeImpl(true, i);
            const lostPoint = QRUtil.getLostPoint(this);
            if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
          }
          return pattern;
        },
        setupTimingPattern: function() {
          for (let r = 8; r < this.moduleCount - 8; r++) {
            if (this.modules[r][6] != null) continue;
            this.modules[r][6] = (r % 2 == 0);
          }
          for (let c = 8; c < this.moduleCount - 8; c++) {
            if (this.modules[6][c] != null) continue;
            this.modules[6][c] = (c % 2 == 0);
          }
        },
        setupPositionAdjustPattern: function() {
          const pos = QRUtil.getPatternPosition(this.typeNumber);
          for (let i = 0; i < pos.length; i++) {
            for (let j = 0; j < pos.length; j++) {
              const row = pos[i], col = pos[j];
              if (this.modules[row][col] != null) continue;
              for (let r = -2; r <= 2; r++) {
                for (let c = -2; c <= 2; c++) {
                  this.modules[row + r][col + c] = (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0));
                }
              }
            }
          }
        },
        setupTypeNumber: function(test) {
          const bits = QRUtil.getBCHTypeNumber(this.typeNumber);
          for (let i = 0; i < 18; i++) {
            const mod = (!test && ((bits >> i) & 1) == 1);
            this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
            this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        },
        setupTypeInfo: function(test, maskPattern) {
          const data = (this.errorCorrectLevel << 3) | maskPattern;
          const bits = QRUtil.getBCHTypeInfo(data);
          for (let i = 0; i < 15; i++) {
            const mod = (!test && ((bits >> i) & 1) == 1);
            if (i < 6) this.modules[i][8] = mod;
            else if (i < 8) this.modules[i + 1][8] = mod;
            else this.modules[this.moduleCount - 15 + i][8] = mod;

            if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
            else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
            else this.modules[8][15 - i - 1] = mod;
          }
          this.modules[this.moduleCount - 8][8] = !test;
        },
        mapData: function(data, maskPattern) {
          let inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
          for (let col = this.moduleCount - 1; col > 0; col -= 2) {
            if (col == 6) col--;
            while (true) {
              for (let c = 0; c < 2; c++) {
                if (this.modules[row][col - c] == null) {
                  let dark = false;
                  if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                  const mask = QRUtil.getMask(maskPattern, row, col - c);
                  if (mask) dark = !dark;
                  this.modules[row][col - c] = dark;
                  bitIndex--;
                  if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
                }
              }
              row += inc;
              if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
            }
          }
        }
      };

      QRCodeModel.createData = function(typeNumber, errorCorrectLevel, dataList) {
        const rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
        const buffer = new QRBitBuffer();
        for (let i = 0; i < dataList.length; i++) {
          const data = dataList[i];
          buffer.put(data.mode, 4);
          buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
          data.write(buffer);
        }
        let totalDataCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.getLengthInBits() > totalDataCount * 8) throw new Error("Data too large for QR");
        buffer.put(0, 4);
        while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
        while (true) {
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(0xEC, 8);
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(0x11, 8);
        }
        return QRCodeModel.createBytes(buffer, rsBlocks);
      };

      QRCodeModel.createBytes = function(buffer, rsBlocks) {
        let offset = 0, maxDcCount = 0, maxEcCount = 0;
        const dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
        for (let r = 0; r < rsBlocks.length; r++) {
          const dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcdata[r] = new Array(dcCount);
          for (let i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
          offset += dcCount;
          const rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
          const rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
          const modPoly = rawPoly.mod(rsPoly);
          ecdata[r] = new Array(rsPoly.getLength() - 1);
          for (let i = 0; i < ecdata[r].length; i++) {
            const modIndex = i + modPoly.getLength() - ecdata[r].length;
            ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
          }
        }
        let totalCodeCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
        const data = new Array(totalCodeCount);
        let index = 0;
        for (let i = 0; i < maxDcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < dcdata[r].length) data[index++] = dcdata[r][i];
          }
        }
        for (let i = 0; i < maxEcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < ecdata[r].length) data[index++] = ecdata[r][i];
          }
        }
        return data;
      };

      const QRUtil = {
        PATTERN_POSITION_TABLE: [
          [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
          [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50], [6, 30, 54],
          [6, 32, 58], [6, 34, 62], [6, 26, 46, 66], [6, 26, 48, 70], [6, 26, 50, 74],
          [6, 30, 54, 78], [6, 30, 56, 82], [6, 30, 58, 86], [6, 34, 62, 90], [6, 28, 50, 72, 94],
          [6, 26, 50, 74, 98], [6, 30, 54, 78, 102], [6, 28, 54, 80, 106], [6, 32, 58, 84, 110],
          [6, 30, 58, 86, 114], [6, 34, 62, 90, 118], [6, 26, 50, 74, 98, 122], [6, 30, 54, 78, 102, 126],
          [6, 26, 52, 78, 104, 130], [6, 30, 56, 82, 108, 134], [6, 34, 60, 86, 112, 138],
          [6, 30, 58, 86, 114, 142], [6, 34, 62, 90, 118, 146], [6, 30, 54, 78, 102, 126, 150],
          [6, 24, 50, 76, 102, 128, 154], [6, 28, 54, 80, 106, 132, 158], [6, 32, 58, 84, 110, 136, 162],
          [6, 26, 54, 82, 110, 138, 166], [6, 30, 58, 86, 114, 142, 170]
        ],
        G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
        G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
        G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
        getBCHTypeInfo: function(data) {
          let d = data << 10;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
          return ((data << 10) | d) ^ QRUtil.G15_MASK;
        },
        getBCHTypeNumber: function(data) {
          let d = data << 12;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
          return (data << 12) | d;
        },
        getBCHDigit: function(data) {
          let digit = 0;
          while (data != 0) { digit++; data >>>= 1; }
          return digit;
        },
        getPatternPosition: function(typeNumber) { return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1]; },
        getMask: function(maskPattern, i, j) {
          switch (maskPattern) {
            case 0: return (i + j) % 2 == 0;
            case 1: return i % 2 == 0;
            case 2: return j % 3 == 0;
            case 3: return (i + j) % 3 == 0;
            case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
            case 5: return (i * j) % 2 + (i * j) % 3 == 0;
            case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
            case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
            default: throw new Error("bad maskPattern:" + maskPattern);
          }
        },
        getErrorCorrectPolynomial: function(errorCorrectLength) {
          let a = new QRPolynomial([1], 0);
          for (let i = 0; i < errorCorrectLength; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
          return a;
        },
        getLengthInBits: function(mode, type) {
          if (1 <= type && type < 10) return 8;
          else if (type < 27) return 16;
          else return 16;
        },
        getLostPoint: function(qrCode) {
          const moduleCount = qrCode.getModuleCount();
          let lostPoint = 0;
          for (let row = 0; row < moduleCount; row++) {
            for (let col = 0; col < moduleCount; col++) {
              let sameCount = 0;
              const dark = qrCode.isDark(row, col);
              for (let r = -1; r <= 1; r++) {
                if (row + r < 0 || moduleCount <= row + r) continue;
                for (let c = -1; c <= 1; c++) {
                  if (col + c < 0 || moduleCount <= col + c) continue;
                  if (r == 0 && c == 0) continue;
                  if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
                }
              }
              if (sameCount > 5) lostPoint += (3 + sameCount - 5);
            }
          }
          return lostPoint;
        }
      };

      const QRMath = {
        glog: function(n) { if (n < 1) throw new Error("glog(" + n + ")"); return QRMath.LOG_TABLE[n]; },
        gexp: function(n) { while (n < 0) n += 255; while (n >= 255) n -= 255; return QRMath.EXP_TABLE[n]; },
        EXP_TABLE: new Array(256),
        LOG_TABLE: new Array(256)
      };
      for (let i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
      for (let i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
      for (let i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

      function QRPolynomial(num, shift) {
        let offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (let i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      }
      QRPolynomial.prototype = {
        get: function(index) { return this.num[index]; },
        getLength: function() { return this.num.length; },
        multiply: function(e) {
          const num = new Array(this.getLength() + e.getLength() - 1);
          for (let i = 0; i < this.getLength(); i++) {
            for (let j = 0; j < e.getLength(); j++) num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
          }
          return new QRPolynomial(num, 0);
        },
        mod: function(e) {
          if (this.getLength() - e.getLength() < 0) return this;
          const ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
          const num = new Array(this.getLength());
          for (let i = 0; i < this.getLength(); i++) num[i] = this.get(i);
          for (let i = 0; i < e.getLength(); i++) num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
          return new QRPolynomial(num, 0).mod(e);
        }
      };

      function QRRSBlock(totalCount, dataCount) {
        this.totalCount = totalCount;
        this.dataCount = dataCount;
      }
      QRRSBlock.RS_BLOCK_TABLE = [
        [1, 26, 19], [1, 44, 34], [1, 70, 55], [1, 100, 80], [1, 134, 108],
        [2, 86, 68], [2, 98, 78], [2, 121, 97], [2, 146, 116], [2, 86, 68, 2, 87, 69],
        [4, 101, 81], [2, 116, 92, 2, 117, 93], [4, 133, 107], [3, 145, 115, 1, 146, 116],
        [5, 109, 87, 1, 110, 88], [5, 122, 98, 1, 123, 99], [1, 135, 107, 5, 136, 108],
        [5, 150, 120, 1, 151, 121], [3, 141, 113, 4, 142, 114], [3, 135, 107, 5, 136, 108],
        [4, 144, 116, 4, 145, 117], [2, 142, 114, 7, 143, 115], [4, 152, 122, 5, 153, 123],
        [6, 147, 117, 4, 148, 118], [8, 132, 106, 4, 133, 107], [10, 142, 114, 2, 143, 115],
        [8, 152, 122, 4, 153, 123], [3, 147, 117, 10, 148, 118], [7, 146, 116, 7, 147, 117],
        [5, 145, 115, 10, 146, 116], [13, 145, 115, 3, 146, 116], [17, 145, 115],
        [17, 145, 115, 1, 146, 116], [13, 145, 115, 6, 146, 116], [12, 151, 121, 7, 152, 122],
        [6, 151, 121, 14, 152, 122], [17, 152, 122, 4, 153, 123], [4, 152, 122, 18, 153, 123],
        [20, 147, 117, 4, 148, 118], [19, 148, 118, 6, 149, 119]
      ];
      QRRSBlock.getRSBlocks = function(typeNumber) {
        const rsBlock = QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1)];
        const list = [];
        for (let i = 0; i < rsBlock.length; i += 3) {
          const count = rsBlock[i], totalCount = rsBlock[i + 1], dataCount = rsBlock[i + 2];
          for (let j = 0; j < count; j++) list.push(new QRRSBlock(totalCount, dataCount));
        }
        return list;
      };

      function QRBitBuffer() {
        this.buffer = [];
        this.length = 0;
      }
      QRBitBuffer.prototype = {
        get: function(index) { return ((this.buffer[Math.floor(index / 8)] >>> (7 - index % 8)) & 1) == 1; },
        put: function(num, length) { for (let i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1); },
        getLengthInBits: function() { return this.length; },
        putBit: function(bit) {
          const bufIndex = Math.floor(this.length / 8);
          if (this.buffer.length <= bufIndex) this.buffer.push(0);
          if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
          this.length++;
        }
      };

      return {
        draw: function(canvas, text) {
          const byteLen = new TextEncoder().encode(text).length;
          // 自适应计算二维码版本
          let type = 1;
          for (let t = 1; t <= 40; t++) {
            let total = 0;
            const blocks = QRRSBlock.getRSBlocks(t);
            for (let b = 0; b < blocks.length; b++) total += blocks[b].dataCount;
            if (total - 3 >= byteLen) { type = t; break; }
          }
          const qr = new QRCodeModel(type, 1); // 1 = Level L
          qr.addData(text);
          qr.make();

          const ctx = canvas.getContext('2d');
          const count = qr.getModuleCount();
          const size = 260;
          canvas.width = size;
          canvas.height = size;
          const tile = size / count;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = '#000000';
          for (let r = 0; r < count; r++) {
            for (let c = 0; c < count; c++) {
              if (qr.isDark(r, c)) {
                ctx.fillRect(Math.round(c * tile), Math.round(r * tile), Math.ceil(tile), Math.ceil(tile));
              }
            }
          }
        }
      };
    })();

    const WORKER_SUB_API = "https://ntshd.walter19821015.ccwu.cc";

    function generateSubscription() {
      const rawNodes = document.getElementById("nodes-input").value.trim();
      if (!rawNodes) {
        alert("请先粘贴优选 IP 列表！");
        return;
      }

      const encodedNodes = encodeURIComponent(rawNodes);
      const fullSubUrl = `${WORKER_SUB_API}/sub?nodes=${encodedNodes}`;

      // 1. 填入输入框
      document.getElementById("sub-url-output").value = fullSubUrl;

      // 2. 无论发生什么先展示卡片区域
      document.getElementById("result-box").style.display = "block";

      // 3. 原生 Canvas 实时绘制，绝对不依赖任何外部 CDN
      try {
        const canvas = document.getElementById("qr-canvas");
        NativeQR.draw(canvas, fullSubUrl);
      } catch (e) {
        console.error("生成二维码出错:", e);
      }
    }

    function copySubUrl() {
      const input = document.getElementById("sub-url-output");
      navigator.clipboard.writeText(input.value).then(() => {
        alert("自适应订阅链接已复制！");
      });
    }
  </script>
