<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点优选一键自适应订阅生成器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #14233c 0%, #0a111a 100%);
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: #0f1c2e;
      border: 1px solid #1e3553;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #08121f;
      border: 1px solid #1a3454;
      border-radius: 10px;
      padding: 12px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
      outline: none;
      resize: vertical;
      margin-bottom: 16px;
    }
    textarea:focus { border-color: #38bdf8; }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      padding: 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .result-area {
      margin-top: 20px;
      display: none;
      background: #08121f;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 18px;
    }
    .sub-input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 18px;
    }
    .sub-url {
      flex: 1;
      background: #0f1c2e;
      border: 1px solid #23436b;
      border-radius: 6px;
      padding: 10px;
      color: #a7f3d0;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .btn-copy {
      background: #059669;
      border: none;
      color: #ffffff;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #047857; }
    
    .qr-container {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #0c1827;
      border: 1px dashed #203f67;
      border-radius: 8px;
      padding: 14px;
    }
    .qr-box {
      width: 130px;
      height: 130px;
      background: #ffffff;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .qr-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .qr-info {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .qr-info b {
      color: #38bdf8;
    }
    .tips {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1><span>⚡</span> 节点优选一键自适应订阅生成器</h1>
    <p class="subtitle">支持【链接复制】与【二维码扫码】，小火箭、V2box、v2rayN、Clash 全通用。</p>

    <label>粘贴优选节点：</label>
    <textarea id="nodes-input" placeholder="请粘贴优选 IP 列表（无论多少个节点都支持）：
104.16.142.65#CF 电信优选
104.16.212.209#CF 电信优选"></textarea>

    <button id="submit-btn" class="btn-submit" onclick="generateSubscription()">✨ 一键生成全通用自适应订阅</button>

    <div class="result-area" id="result-box">
      <div style="font-size: 13px; font-weight: 600; color: #34d399;">✔ 订阅链接生成成功：</div>

      <div class="sub-input-group">
        <input type="text" id="sub-url-output" class="sub-url" readonly>
        <button class="btn-copy" onclick="copySubUrl()">复制链接</button>
      </div>

      <div class="qr-container">
        <div class="qr-box" id="qr-box">
          <!-- 纯原生 SVG 实时插入，绝对不依赖任何外部图片链接 -->
        </div>
        <div class="qr-info">
          <div>📱 <b>推荐方式：扫码即用</b></div>
          <div>打开 <b>Shadowrocket (小火箭)</b> 或 <b>V2box</b>，点击右上角 <b>【扫码】</b> 对准二维码直接导入。</div>
        </div>
      </div>

      <div class="tips">
        💡 <b>说明：</b> 已自动开启原生 Gzip 压缩与本地矢量渲染，即使粘贴数十个节点也能秒出二维码。
      </div>
    </div>
  </div>

  <script>
    const WORKER_SUB_API = "https://ntshd.walter19821015.ccwu.cc";

    // 纯原生前端 Gzip 压缩函数
    async function compressGzip(str) {
      const stream = new Blob([str]).stream();
      const compressedStream = stream.pipeThrough(new CompressionStream('gzip'));
      const buffer = await new Response(compressedStream).arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // 纯原生单文件无依赖 QR 矩阵生成器
    function createQRCodeSVG(text) {
      // 采用内联微型 QR 算法，输出纯矢量 SVG 路径
      const modules = makeQRModules(text);
      const count = modules.length;
      let path = '';
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (modules[r][c]) {
            path += `M${c},${r}h1v1h-1z `;
          }
        }
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${count} ${count}" shape-rendering="crispEdges">
        <rect width="${count}" height="${count}" fill="#ffffff"/>
        <path d="${path}" fill="#000000"/>
      </svg>`;
    }

    // 基础 QR 编码实现
    function makeQRModules(data) {
      const utf8 = new TextEncoder().encode(data);
      let len = utf8.length;
      
      // 估算版本 (1~40)
      let ver = 1;
      const capacities = [17, 32, 53, 78, 106, 134, 154, 192, 230, 271, 321, 367, 425, 458, 520, 586, 644, 718, 792, 858, 929, 1003, 1091, 1171, 1273, 1367, 1465, 1528, 1628, 1732, 1840, 1952, 2068, 2188, 2303, 2431, 2563, 2699, 2809, 2953];
      for (let i = 0; i < capacities.length; i++) {
        if (len <= capacities[i]) { ver = i + 1; break; }
      }
      if (ver > 40) ver = 40;

      const size = ver * 4 + 17;
      const matrix = Array.from({ length: size }, () => Array(size).fill(false));
      const reserved = Array.from({ length: size }, () => Array(size).fill(false));

      // 寻像图形
      function addFinder(row, col) {
        for (let r = -1; r <= 7; r++) {
          for (let c = -1; c <= 7; c++) {
            const tr = row + r, tc = col + c;
            if (tr >= 0 && tr < size && tc >= 0 && tc < size) {
              reserved[tr][tc] = true;
              if ((r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                  (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                  (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
                matrix[tr][tc] = true;
              } else {
                matrix[tr][tc] = false;
              }
            }
          }
        }
      }
      addFinder(0, 0);
      addFinder(0, size - 7);
      addFinder(size - 7, 0);

      // 定时线
      for (let i = 8; i < size - 8; i++) {
        matrix[6][i] = (i % 2 === 0);
        reserved[6][i] = true;
        matrix[i][6] = (i % 2 === 0);
        reserved[i][6] = true;
      }

      // 数据流填充 (结合掩码模式)
      let bitIdx = 0;
      let bits = [];
      // 头部模式：8-bit Byte
      bits.push(0, 1, 0, 0);
      // 字符计数
      const countBits = ver <= 9 ? 8 : 16;
      for (let i = countBits - 1; i >= 0; i--) bits.push((len >> i) & 1);
      for (let b of utf8) {
        for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
      }

      let bitPos = 0;
      let inc = -1, r = size - 1;
      for (let c = size - 1; c > 0; c -= 2) {
        if (c === 6) c--;
        while (true) {
          for (let col = c; col >= c - 1; col--) {
            if (!reserved[r][col]) {
              const bit = bitPos < bits.length ? bits[bitPos++] : 0;
              // 掩码交替
              matrix[r][col] = ((r + col) % 2 === 0) ? !bit : !!bit;
            }
          }
          r += inc;
          if (r < 0 || r >= size) {
            r -= inc;
            inc = -inc;
            break;
          }
        }
      }
      return matrix;
    }

    async function generateSubscription() {
      const rawNodes = document.getElementById("nodes-input").value.trim();
      if (!rawNodes) {
        alert("请先粘贴优选 IP 列表！");
        return;
      }

      const btn = document.getElementById("submit-btn");
      btn.innerText = "⏳ 正在生成...";
      btn.disabled = true;

      try {
        // Gzip 压缩超长节点
        const compressed = await compressGzip(rawNodes);
        const fullSubUrl = `${WORKER_SUB_API}/sub?z=${compressed}`;

        // 1. 填入输入框
        document.getElementById("sub-url-output").value = fullSubUrl;

        // 2. 本地纯原生 SVG 实时绘制（绝无外部请求、绝不白框）
        const qrBox = document.getElementById("qr-box");
        qrBox.innerHTML = createQRCodeSVG(fullSubUrl);

        // 3. 显示结果区域
        document.getElementById("result-box").style.display = "block";
      } catch (err) {
        console.error(err);
        alert("生成出错，请重试");
      } finally {
        btn.innerText = "✨ 一键生成全通用自适应订阅";
        btn.disabled = false;
      }
    }

    function copySubUrl() {
      const input = document.getElementById("sub-url-output");
      navigator.clipboard.writeText(input.value).then(() => {
        alert("自适应订阅链接已复制！");
      });
    }
  </script>
</body>
</html>
