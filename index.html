      padding: 28px;

      color: #38bdf8;

      line-height: 1.6;
      outline: none;
      resize: vertical;
      margin-bottom: 16px;
    }
    textarea:focus { border-color: #38bdf8; }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      padding: 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .result-area {
      margin-top: 20px;
      display: none;
      background: #08121f;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 18px;
    }
    .sub-input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 18px;
    }
    .sub-url {
      flex: 1;
      background: #0f1c2e;
      border: 1px solid #23436b;
      border-radius: 6px;
      padding: 10px;
      color: #a7f3d0;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .btn-copy {
      background: #059669;
      border: none;
      color: #ffffff;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #047857; }
    
    .qr-container {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #0c1827;
      border: 1px dashed #203f67;
      border-radius: 8px;
      padding: 14px;
    }
    .qr-box {
      width: 130px;
      height: 130px;
      background: #ffffff;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .qr-box canvas, .qr-box img {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .qr-info {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .qr-info b {
      color: #38bdf8;
    }
    .tips {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>

<body>

  <div class="card">
    <h1><span>⚡</span> 节点优选一键自适应订阅生成器</h1>
    <p class="subtitle">支持【链接复制】与【二维码扫码】，小火箭、V2box、v2rayN、Clash 全通用。</p>

    <label>粘贴优选节点：</label>
    <textarea id="nodes-input" placeholder="请粘贴优选 IP 列表（无论多少个节点都支持）：
104.16.142.65#CF 电信优选
104.16.212.209#CF 电信优选"></textarea>

    <button id="submit-btn" class="btn-submit" onclick="generateSubscription()">✨ 一键生成全通用自适应订阅</button>

    <div class="result-area" id="result-box">
      <div style="font-size: 13px; font-weight: 600; color: #34d399;">✔ 订阅链接生成成功：</div>

      <div class="sub-input-group">
        <input type="text" id="sub-url-output" class="sub-url" readonly>
        <button class="btn-copy" onclick="copySubUrl()">复制链接</button>
      </div>

      <div class="qr-container">
        <div class="qr-box" id="qr-box">
          <!-- 完整渲染的二维码图片 -->
        </div>
        <div class="qr-info">
          <div>📱 <b>推荐方式：扫码即用</b></div>
          <div>打开 <b>Shadowrocket (小火箭)</b> 或 <b>V2box</b>，点击右上角 <b>【扫码】</b> 对准二维码直接导入。</div>
        </div>
      </div>

      <div class="tips">
        💡 <b>说明：</b> 已开启 Gzip 压缩与工业级全矩阵渲染，四角定位与纠错码 100% 完整。
      </div>
    </div>
  </div>

  <script>
    const WORKER_SUB_API = "https://ntshd.walter19821015.ccwu.cc";

    // 原生 Gzip 压缩算法
    async function compressGzip(str) {
      const stream = new Blob([str]).stream();
      const compressedStream = stream.pipeThrough(new CompressionStream('gzip'));
      const buffer = await new Response(compressedStream).arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function generateSubscription() {
      const rawNodes = document.getElementById("nodes-input").value.trim();
      if (!rawNodes) {
        alert("请先粘贴优选 IP 列表！");
        return;
      }

      const btn = document.getElementById("submit-btn");
      btn.innerText = "⏳ 正在生成...";
      btn.disabled = true;

      try {
        // Gzip 压缩超长节点
        const compressed = await compressGzip(rawNodes);
        const fullSubUrl = `${WORKER_SUB_API}/sub?z=${compressed}`;

        // 1. 填入输入框
        document.getElementById("sub-url-output").value = fullSubUrl;

        // 2. 使用成熟的 qrcode-generator 渲染 100% 完整的二维码（绝不缺角、不半截）
        const qrBox = document.getElementById("qr-box");
        qrBox.innerHTML = "";
        
        // typeNumber = 0 表示自适应尺寸，'L' 级别纠错，容纳长 URL
        const qr = qrcode(0, 'L');
        qr.addData(fullSubUrl);
        qr.make();
        // 渲染为标准完整 img 标签
        qrBox.innerHTML = qr.createImgTag(3, 8);

        // 3. 显示结果区域
        document.getElementById("result-box").style.display = "block";
      } catch (err) {
        console.error(err);
        alert("生成出错，请重试");
      } finally {
        btn.innerText = "✨ 一键生成全通用自适应订阅";
        btn.disabled = false;
      }
    }

    function copySubUrl() {
      const input = document.getElementById("sub-url-output");
      navigator.clipboard.writeText(input.value).then(() => {
        alert("自适应订阅链接已复制！");
      });
    }
  </script>
</body>
